name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write # Дает право создавать релизы

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Generate Gradle Wrapper for 8.2
      run: gradle wrapper --gradle-version 8.2

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # Сохраняем APK как артефакт (для истории)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AndroidUdpMic-Debug
        path: app/build/outputs/apk/debug/app-V1.8.apk

    # СОЗДАЕМ РЕЛИЗ (вместо git push)
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.8
        name: Release V1.8
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-V1.8.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}